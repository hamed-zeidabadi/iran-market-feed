name: Update prices every 5 minutes
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: prices-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/proxy.test.mjs tests/audit-worker.test.mjs tests/scheduler.test.mjs
      - uses: actions/cache/restore@v4
        with:
          path: .validation/monitoring.json
          key: monitoring-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: monitoring-${{ github.ref_name }}-
      - name: Restore durable monitoring baseline
        continue-on-error: true
        run: python -m scripts.audit_archive restore --state .validation/monitoring.json
        env:
          AUDIT_URL: ${{ secrets.AUDIT_URL }}
          AUDIT_SECRET: ${{ secrets.AUDIT_SECRET }}
      - run: python -m marketfeed
        env:
          MARKET_PROXY_URL: ${{ secrets.MARKET_PROXY_URL }}
          MARKET_PROXY_SECRET: ${{ secrets.MARKET_PROXY_SECRET }}
      - name: Archive collection incidents
        if: always()
        continue-on-error: true
        run: python -m scripts.audit_archive upload --file .validation/incidents.jsonl --state .validation/monitoring.json
        env:
          AUDIT_URL: ${{ secrets.AUDIT_URL }}
          AUDIT_SECRET: ${{ secrets.AUDIT_SECRET }}
      - name: Retain collection journal for archive recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-incidents
          path: .validation/incidents.jsonl
          include-hidden-files: true
          retention-days: 30
      - uses: actions/cache/save@v4
        with:
          path: .validation/monitoring.json
          key: monitoring-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/upload-artifact@v4
        with:
          name: publication-input
          path: public/api/prices.json
          retention-days: 1
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: publication-input
          path: public/api
      - name: Deploy API snapshot
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Measure public snapshot delay
        continue-on-error: true
        run: python -m scripts.check_publication --url "${{ steps.deployment.outputs.page_url }}api/prices.json"
      - name: Archive publication incidents
        if: always()
        continue-on-error: true
        run: python -m scripts.audit_archive upload --file .validation/publication.jsonl
        env:
          AUDIT_URL: ${{ secrets.AUDIT_URL }}
          AUDIT_SECRET: ${{ secrets.AUDIT_SECRET }}
      - name: Retain publication journal for archive recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-incidents
          path: .validation/publication.jsonl
          include-hidden-files: true
          retention-days: 30
  audit_status:
    needs: [collect, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record workflow outcome independently of collector success
        run: python -m scripts.audit_archive workflow --file .validation/workflow.jsonl
        env:
          AUDIT_URL: ${{ secrets.AUDIT_URL }}
          AUDIT_SECRET: ${{ secrets.AUDIT_SECRET }}
          COLLECT_RESULT: ${{ needs.collect.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          AUDIT_GITHUB_TOKEN: ${{ github.token }}
      - name: Retain workflow journal for archive recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-incidents
          path: .validation/workflow.jsonl
          include-hidden-files: true
          retention-days: 30
