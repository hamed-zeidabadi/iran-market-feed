name = "iran-market-feed-scheduler"
main = "worker.mjs"
compatibility_date = "2026-01-01"

# The Worker is cron-only; no public URL is needed.
workers_dev = false
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
GITHUB_REPOSITORY = "hamed-zeidabadi/iran-market-feed"
WORKFLOW_FILE = "update.yml"
WORKFLOW_REF = "main"
AUDIT_URL = "https://iran-market-feed-audit.zeidabadi73.workers.dev"

# Secret, set with: npx wrangler secret put GITHUB_TOKEN
# Fine-grained PAT limited to this repository with only Actions: Read and write.
